    <!-- tema salvo; sem escolha, segue o sistema (claro por padrão) -->
    <script>
      ;(function () {
        var tema
        try { tema = localStorage.getItem('tema') } catch (e) {}
        if (tema !== 'light' && tema !== 'dark') tema = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = tema
        document.documentElement.classList.add('js')
        document.querySelector('meta[name="theme-color"]').setAttribute('content', tema === 'dark' ? '#16171a' : '#f6f6f4')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
